version: 2

models:
  # ------------------------------------------------------------------ FACTS
  - name: fct_sales_order_line
    description: >
      Transaction fact. Grain: one row per sales-order line item. Point-in-time
      cost, allocated freight/tax, role-playing dates. FKs use surrogate keys
      and never lose rows (unknown member -1).
    columns:
      - name: sk_sales_order_line
        description: Surrogate key. Enforces the declared grain.
        tests: [unique, not_null]
      - name: sales_order_detail_id
        description: Degenerate dimension; natural grain of the line.
        tests: [unique, not_null]
      - name: sk_product
        tests:
          - not_null
          - relationships: { to: ref('dim_product'), field: sk_product }
      - name: sk_customer
        tests:
          - not_null
          - relationships: { to: ref('dim_customer'), field: sk_customer }
      - name: sk_salesperson
        tests:
          - not_null
          - relationships: { to: ref('dim_salesperson'), field: sk_salesperson }
      - name: sk_territory
        tests:
          - not_null
          - relationships: { to: ref('dim_territory'), field: sk_territory }
      - name: sk_special_offer
        tests:
          - not_null
          - relationships: { to: ref('dim_special_offer'), field: sk_special_offer }
      - name: sk_ship_method
        tests:
          - not_null
          - relationships: { to: ref('dim_ship_method'), field: sk_ship_method }
      - name: sk_order_status
        tests:
          - not_null
          - relationships: { to: ref('dim_order_status'), field: sk_order_status }
      - name: sk_currency
        tests:
          - not_null
          - relationships: { to: ref('dim_currency'), field: sk_currency }
      - name: sk_bill_to_geography
        tests:
          - not_null
          - relationships: { to: ref('dim_geography'), field: sk_geography }
      - name: sk_ship_to_geography
        tests:
          - not_null
          - relationships: { to: ref('dim_geography'), field: sk_geography }
      - name: net_amount
        description: qty * unit_price * (1 - discount).
        tests: [not_null]

  - name: fct_sales_order
    description: >
      Transaction fact at header grain. Holds the unallocated freight/tax/total
      the line fact cannot carry. One row per sales order.
    columns:
      - name: sk_sales_order
        tests: [unique, not_null]
      - name: sales_order_id
        tests: [unique, not_null]
      - name: sk_customer
        tests:
          - relationships: { to: ref('dim_customer'), field: sk_customer }

  - name: fct_sales_quota
    description: "Transaction fact. Grain: one salesperson per quota period."
    columns:
      - name: sk_sales_quota
        tests: [unique, not_null]
      - name: sk_salesperson
        tests:
          - relationships: { to: ref('dim_salesperson'), field: sk_salesperson }

  - name: bridge_order_sales_reason
    description: >
      Bridge resolving the M:N between orders and sales reasons.
      allocation_factor = 1 / reasons-per-order so measures reconcile.
    columns:
      - name: sk_order_sales_reason
        tests: [unique, not_null]
      - name: sk_sales_reason
        tests:
          - relationships: { to: ref('dim_sales_reason'), field: sk_sales_reason }

  # -------------------------------------------------------------- DIMENSIONS
  - name: dim_product
    description: Type-1 (SCD2 pending). Flattened Product/Subcategory/Category. Has unknown member -1.
    columns:
      - name: sk_product
        tests: [unique, not_null]
  - name: dim_customer
    description: Conforms individuals (Person) and reseller Stores. Unknown member -1.
    columns:
      - name: sk_customer
        tests: [unique, not_null]
  - name: dim_salesperson
    description: SalesPerson + Employee + Person. Includes unknown/online member -1.
    columns:
      - name: sk_salesperson
        tests: [unique, not_null]
  - name: dim_territory
    columns:
      - name: sk_territory
        tests: [unique, not_null]
  - name: dim_geography
    description: Address/StateProvince/CountryRegion. Role-playing bill-to / ship-to.
    columns:
      - name: sk_geography
        tests: [unique, not_null]
  - name: dim_ship_method
    columns:
      - name: sk_ship_method
        tests: [unique, not_null]
  - name: dim_special_offer
    columns:
      - name: sk_special_offer
        tests: [unique, not_null]
  - name: dim_currency
    columns:
      - name: sk_currency
        tests: [unique, not_null]
  - name: dim_order_status
    description: Junk dimension collapsing status + online flag. Unknown member -1.
    columns:
      - name: sk_order_status
        tests: [unique, not_null]
  - name: dim_sales_reason
    description: Reached only through the bridge, never joined to a fact directly.
    columns:
      - name: sk_sales_reason
        tests: [unique, not_null]
  - name: dim_date
    description: Generated date spine with role-playing keys and an unknown member -1.
    columns:
      - name: sk_date
        tests: [unique, not_null]
