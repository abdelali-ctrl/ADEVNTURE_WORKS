version: 2

models:
  - name: stg_address
    columns:
      - name: address_id
        tests:
          - unique
          - not_null

      - name: address_line1
        tests:
          - not_null

      - name: address_line2
        tests:
          - not_null

      - name: city
        tests:
          - not_null

      - name: state_province_id
        tests:
          - not_null

      - name: postal_code
        tests:
          - not_null

      - name: row_guid
        tests:
          - unique
          - not_null

      - name: modified_date
        tests:
          - not_null