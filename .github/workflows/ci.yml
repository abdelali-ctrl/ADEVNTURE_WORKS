name: dbt CI

# Cahier §9 (grille : "CI" = niveau exceptionnel). Lance dbt build + tests sur
# chaque PR vers main. Les secrets Snowflake sont dans les GitHub Secrets, jamais
# dans le depot.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt   # le projet dbt vit dans dbt/
    env:
      DBT_PROFILES_DIR: ./ci
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE:  OLTP

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Write CI profile
        run: |
          mkdir -p ci
          cat > ci/profiles.yml <<'EOF'
          adventureworks_dwh:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
                schema: gold_ci
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt build (models + tests)
        run: dbt build --fail-fast

      - name: dbt source freshness (non bloquant)
        run: dbt source freshness || true
