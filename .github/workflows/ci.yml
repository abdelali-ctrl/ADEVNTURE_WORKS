name: dbt CI

# Cahier §9 (grille : "CI" = niveau exceptionnel). Lance dbt build + tests sur
# chaque PR. Authentification Snowflake par PAIRE DE CLES RSA (pas de mot de passe).
# Les secrets sont dans les GitHub Secrets, jamais dans le depot.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   SNOWFLAKE_ACCOUNT      ex. ECURZMZ-DV51280
#   SNOWFLAKE_USER         DBT_CI_USER   (utilisateur de service dedie)
#   SNOWFLAKE_ROLE         DBT_CI_ROLE   (least-privilege, jamais ACCOUNTADMIN)
#   SNOWFLAKE_WAREHOUSE    COMPUTE_WH
#   SNOWFLAKE_PRIVATE_KEY  contenu PEM de rsa_key.p8 (cle privee, multi-lignes)
# Voir platform/ci_user.sql pour la creation de l'utilisateur + la cle.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt   # le projet dbt vit dans dbt/
    env:
      DBT_PROFILES_DIR: ./ci
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE:  OLTP

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Ecrire la cle privee RSA (depuis le secret)
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ci
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ci/rsa_key.p8
          chmod 600 ci/rsa_key.p8

      - name: Ecrire le profil dbt (cle RSA, cible ci -> schemas _ci)
        run: |
          cat > ci/profiles.yml <<'EOF'
          adventureworks_dwh:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                private_key_path: "ci/rsa_key.p8"
                # private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
                schema: gold          # la macro ajoute _ci en cible ci (gold_ci, silver_ci)
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt build (models + tests, schemas _ci isoles)
        run: dbt build --fail-fast

      - name: Nettoyer la cle privee
        if: always()
        run: rm -f ci/rsa_key.p8

      - name: dbt source freshness (non bloquant)
        run: dbt source freshness || true
